<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data:; img-src 'self' data:"
    />
    <title>FoxQuery Studio</title>
  </head>
  <body>
    <header class="toolbar" role="toolbar" aria-label="Thanh công cụ">
      <button id="btn-new" type="button" class="tool labelled" data-command="file.new" title="Truy vấn mới (Ctrl+N)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M9.5 1.5v3h3"/><path d="M8 7.5v4M6 9.5h4"/></svg><span>Truy vấn mới</span></button>
      <button id="btn-open" type="button" class="tool" data-command="file.open" title="Mở tệp (Ctrl+O)" aria-label="Mở tệp"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 12.5v-9h4l1.5 1.5h6v2"/><path d="M1.5 12.5l2-5.5h11l-2 5.5z"/></svg></button>
      <button id="btn-save" type="button" class="tool" data-command="file.save" title="Lưu (Ctrl+S)" aria-label="Lưu"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h9l2 2v9h-11z"/><path d="M5 2.5v3.5h5v-3.5M4.5 13.5v-4.5h7v4.5"/></svg></button>
      <span class="divider"></span>
      <button id="btn-connect" type="button" class="tool" data-command="connection.connect" title="Kết nối (Ctrl+Shift+C)" aria-label="Kết nối"><svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4"/><path d="M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/></svg></button>
      <button id="btn-disconnect" type="button" class="tool" data-command="connection.disconnect" title="Ngắt kết nối" aria-label="Ngắt kết nối" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="4" rx="5" ry="2"/><path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4"/><path d="M2 14.5l12-13"/></svg></button>
      <button id="btn-local" type="button" class="tool" data-command="local.open" title="Mở CSDL FoxPro cục bộ (Ctrl+Shift+O)" aria-label="Mở CSDL FoxPro cục bộ"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 12.5v-9h4l1.5 1.5h7.5v7.5z"/><ellipse cx="10.5" cy="8.5" rx="2.5" ry="1"/><path d="M8 8.5v2.5c0 .6 1.1 1 2.5 1s2.5-.4 2.5-1V8.5"/></svg></button>
      <span class="divider"></span>
      <button id="btn-run" type="button" class="tool labelled run" data-command="query.run" title="Chạy (F5)" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path class="fill" d="M4 2.5l9 5.5-9 5.5z"/></svg><span>Chạy</span></button>
      <span class="divider"></span>
      <button id="btn-toggle-compare" type="button" class="tool" data-command="view.compare" title="So sánh FOX-SQL và T-SQL (Ctrl+Shift+D)" aria-label="So sánh FOX-SQL và T-SQL" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 2.5h5.5v11h-5.5zM9 2.5h5.5v11h-5.5z"/><path d="M3 5.5h2.5M3 8h2.5M10.5 5.5h2.5M10.5 8h2.5M10.5 10.5h2.5"/></svg></button>
      <span class="spacer"></span>
      <button id="btn-update" type="button" class="primary" hidden></button>
    </header>

    <main class="workspace">
      <aside class="explorer">
        <div class="pane-title">Cây đối tượng</div>
        <input id="explorer-filter" type="search" placeholder="Lọc bảng và view theo tên" aria-label="Lọc bảng và view" />
        <div id="explorer-tree" class="tree"></div>
      </aside>
      <div id="split-explorer" class="splitter vertical" role="separator" aria-orientation="vertical"></div>

      <section class="center">
        <div class="tab-strip">
          <div id="tabs" class="tabs" role="tablist"></div>
          <div class="language-switch" role="group" aria-label="Ngôn ngữ của tab">
            <button type="button" data-language="foxpro" title="Soạn bằng FoxPro (Ctrl+Shift+L để đổi)">FOX-SQL</button>
            <button type="button" data-language="tsql" title="Soạn bằng T-SQL (Ctrl+Shift+L để đổi)">T-SQL</button>
          </div>
        </div>
        <div class="editors">
          <div class="column">
            <div id="source-title" class="column-title"></div>
            <div id="editor" class="editor"></div>
          </div>
          <div class="column compare">
            <div id="compare-title" class="column-title"></div>
            <div id="compare-editor" class="editor"></div>
          </div>
        </div>
        <div id="split-output" class="splitter horizontal" role="separator" aria-orientation="horizontal"></div>
        <div class="output">
          <div class="output-tabs">
            <button type="button" data-pane="results" class="active">Kết quả</button>
            <button type="button" data-pane="messages">Thông báo</button>
            <button id="tab-translation" type="button" data-pane="tsql">T-SQL đã dịch</button>
            <span id="result-sets" class="result-sets"></span>
          </div>
          <div id="pane-results" class="pane"></div>
          <pre id="pane-messages" class="pane text" hidden></pre>
          <pre id="pane-tsql" class="pane text" hidden></pre>
        </div>
        <div id="query-status" class="query-status" role="status" aria-label="Trạng thái của tab truy vấn">
          <span id="query-state"></span>
          <span class="spacer"></span>
          <span id="status-position"></span>
          <span id="status-language" title="Ngôn ngữ của tab"></span>
          <span id="status-cursor" title="Cursor đang chọn của tab"></span>
          <span id="run-status"></span>
          <span id="status-rows"></span>
        </div>
      </section>
    </main>

    <footer id="statusbar" class="statusbar" role="status" aria-label="Trạng thái ứng dụng">
      <span id="status-state">Chưa kết nối</span>
      <span id="connection-status"></span>
      <span class="spacer"></span>
      <button id="app-version" type="button" class="version" title="Kiểm tra cập nhật"></button>
    </footer>

    <dialog id="connect-dialog">
      <form id="connect-form" method="dialog">
        <h2>Kết nối SQL Server</h2>
        <label>Máy chủ <input name="server" required placeholder="host hoặc host\instance" /></label>
        <label>Cổng <input name="port" type="number" min="1" max="65535" placeholder="1433" /></label>
        <label>Cơ sở dữ liệu <input name="database" required /></label>
        <label>Tài khoản <input name="user" required autocomplete="username" /></label>
        <label>Mật khẩu <input name="password" type="password" required autocomplete="current-password" /></label>
        <label class="check"><input name="encrypt" type="checkbox" checked /> Mã hóa kết nối</label>
        <label class="check"><input name="trust" type="checkbox" /> Tin chứng chỉ máy chủ (nội bộ)</label>
        <p id="connect-error" class="error" role="alert" hidden></p>
        <div class="actions">
          <button type="button" id="connect-cancel">Hủy</button>
          <button type="submit" class="primary" id="connect-submit">Kết nối</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
